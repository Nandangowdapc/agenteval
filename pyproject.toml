[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agenteval"
version = "0.1.0"
description = "Production evaluation framework for agentic AI"
authors = [{name = "Nandan Gowda P C", email = "your@email.com"}]
requires-python = ">=3.11"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88

[tool.ruff.lint.per-file-ignores]
# Numbered example scripts are run directly, never imported.
"examples/*" = ["N999"]
