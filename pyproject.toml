[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agenteval"
version = "0.1.0"
description = "Production evaluation framework for agentic AI"
authors = [{name = "Nandan Gowda P C", email = "your@email.com"}]
requires-python = ">=3.11"

[project.optional-dependencies]
# Groq is the default provider (see requirements.txt); install one of these to
# use another with AGENTEVAL_PROVIDER or --provider.
openai = ["langchain-openai>=0.2"]
anthropic = ["langchain-anthropic>=0.3"]
ollama = ["langchain-ollama>=0.2"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88

[tool.ruff.lint.per-file-ignores]
# Numbered example scripts are run directly, never imported.
"examples/*" = ["N999"]
